<!DOCTYPE html>
<html lang="en">

<head>

        href="../style.css"
    >

<body>

    <!-- LOAN CALCULATOR -->

    <main class="calculator-page">

        <div class="calculator-container">

            <a href="../index.html" class="back-home">
    ← Back to ToolNest
</a>

            <h1>
                Loan Calculator
            </h1>

            <p class="calculator-description">
                Estimate loan payments and total interest.
            </p>


            <div class="calculator-box">

                <!-- LOAN AMOUNT -->

                <label for="loanAmount">
                    Loan Amount
                </label>

                <input
                    type="number"
                    id="loanAmount"
                    placeholder="Enter loan amount"
                    min="0"
                    step="any"
                >


                <!-- INTEREST RATE -->

                <label for="interestRate">
                    Annual Interest Rate (%)
                </label>

                <input
                    type="number"
                    id="interestRate"
                    placeholder="Example: 10"
                    min="0"
                    step="any"
                >


                <!-- LOAN TERM -->

                <label for="loanTerm">
                    Loan Term
                </label>

                <div class="loan-term-row">

                    <input
                        type="number"
                        id="loanTerm"
                        placeholder="Enter term"
                        min="1"
                        step="any"
                    >

                    <select id="loanTermUnit">

                        <option value="daily">
                            Daily
                        </option>

                        <option value="weekly">
                            Weekly
                        </option>

                        <option
                            value="monthly"
                            selected
                        >
                            Monthly
                        </option>

                        <option value="yearly">
                            Yearly
                        </option>

                    </select>

                </div>


                <!-- CALCULATE BUTTON -->

                <button
                    type="button"
                    class="calculate-button"
                    id="calculateLoan"
                >
                    Calculate Loan
                </button>


                <!-- CLEAR BUTTON -->

                <button
                    type="button"
                    class="clear-button"
                    id="clearLoan"
                >
                    Clear
                </button>


                <!-- RESULT -->

                <div
                    class="calculator-result"
                    id="loanResult"
                >
                    Your result will appear here.
                </div>

            </div>

        </div>

    </main>

    </main>

<footer class="tool-footer">

    <!-- LOAN CALCULATOR JAVASCRIPT -->

    <script>

        const loanAmount =
            document.getElementById("loanAmount");

        const interestRate =
            document.getElementById("interestRate");

        const loanTerm =
            document.getElementById("loanTerm");

        const loanTermUnit =
            document.getElementById("loanTermUnit");

        const calculateLoan =
            document.getElementById("calculateLoan");

        const clearLoan =
            document.getElementById("clearLoan");

        const loanResult =
            document.getElementById("loanResult");


        /*
        ==========================================
        CALCULATE LOAN
        ==========================================
        */

        calculateLoan.addEventListener(
            "click",
            function () {

                const principal =
                    Number(loanAmount.value);

                const annualRate =
                    Number(interestRate.value);

                const term =
                    Number(loanTerm.value);


                /*
                CHECK EMPTY FIELDS
                */

                if (
                    loanAmount.value === "" ||
                    interestRate.value === "" ||
                    loanTerm.value === ""
                ) {

                    loanResult.textContent =
                        "Please enter all loan details.";

                    return;

                }


                /*
                CHECK VALID VALUES
                */

                if (
                    principal <= 0 ||
                    annualRate < 0 ||
                    term <= 0
                ) {

                    loanResult.textContent =
                        "Please enter valid values.";

                    return;

                }


                /*
                ==========================================
                CONVERT LOAN TERM
                ==========================================
                */

                let totalDays;


                if (
                    loanTermUnit.value === "daily"
                ) {

                    totalDays =
                        term;

                }


                else if (
                    loanTermUnit.value === "weekly"
                ) {

                    totalDays =
                        term * 7;

                }


                else if (
                    loanTermUnit.value === "monthly"
                ) {

                    totalDays =
                        term * 30;

                }


                else if (
                    loanTermUnit.value === "yearly"
                ) {

                    totalDays =
                        term * 365;

                }


                /*
                Convert days to years
                */

                const years =
                    totalDays / 365;


                /*
                ==========================================
                MONTHLY INTEREST RATE
                ==========================================
                */

                const monthlyRate =
                    annualRate / 100 / 12;


                /*
                Number of monthly payments
                */

                const numberOfPayments =
                    years * 12;


                let monthlyPayment;


                /*
                ==========================================
                ZERO INTEREST LOAN
                ==========================================
                */

                if (monthlyRate === 0) {

                    monthlyPayment =
                        principal /
                        numberOfPayments;

                }


                /*
                ==========================================
                NORMAL INTEREST LOAN
                ==========================================
                */

                else {

                    monthlyPayment =
                        principal *
                        (
                            monthlyRate *
                            Math.pow(
                                1 + monthlyRate,
                                numberOfPayments
                            )
                        ) /
                        (
                            Math.pow(
                                1 + monthlyRate,
                                numberOfPayments
                            ) - 1
                        );

                }


                /*
                ==========================================
                TOTAL PAYMENT
                ==========================================
                */

                const totalPayment =
                    monthlyPayment *
                    numberOfPayments;


                /*
                ==========================================
                TOTAL INTEREST
                ==========================================
                */

                const totalInterest =
                    totalPayment -
                    principal;


                /*
                ==========================================
                DISPLAY RESULT
                ==========================================
                */

                loanResult.innerHTML =
                    `
                    Monthly Payment:
                    ${monthlyPayment.toFixed(2)}

                    <br><br>

                    Total Payment:
                    ${totalPayment.toFixed(2)}

                    <br><br>

                    Total Interest:
                    ${totalInterest.toFixed(2)}
                    `;

            }
        );


        /*
        ==========================================
        CLEAR BUTTON
        ==========================================
        */

        clearLoan.addEventListener(
            "click",
            function () {

                loanAmount.value = "";

                interestRate.value = "";

                loanTerm.value = "";

                loanTermUnit.value = "monthly";

                loanResult.textContent =
                    "Your result will appear here.";

            }
        );

    </script>


    <!-- MOBILE MENU JAVASCRIPT -->

    <script>

        const menuButton =
            document.getElementById("menuButton");

        const navLinks =
            document.querySelector(".nav-links");


        if (
            menuButton &&
            navLinks
        ) {

            menuButton.addEventListener(
                "click",
                function () {

                    navLinks.classList.toggle(
                        "menu-open"
                    );

                }
            );


            const menuItems =
                navLinks.querySelectorAll("a");


            menuItems.forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            navLinks.classList.remove(
                                "menu-open"
                            );

                        }
                    );

                }
            );

        }

    </script>


    <!-- MAIN TOOLNEST JAVASCRIPT -->

    <script src="../script.js"></script>

</body>

</html>
