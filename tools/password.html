<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Generator - ToolNest</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>

<body>

    <!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        <span>Tool</span>Nest
    </div>

    <nav class="nav-links">

        <a href="../index.html">Home</a>

        <a href="../index.html#tools">Tools</a>

        <a href="../index.html#categories">Categories</a>

        <a href="../index.html#about">About</a>

    </nav>

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Open menu"
    >
        ☰
    </button>

</header>

    <!-- PASSWORD GENERATOR -->

    <main class="calculator-page">

        <div class="calculator-container">

            <a href="../index.html" class="back-home">
    ← Back to ToolNest
</a>

            <h1>
                Password Generator
            </h1>

            <p class="calculator-description">
                Generate a random password with your chosen length.
            </p>


            <div class="calculator-box">

                <label for="passwordLength">
                    Password Length
                </label>

                <input
                    type="number"
                    id="passwordLength"
                    value="16"
                    min="8"
                    max="64"
                >


                <label>
                    <input
                        type="checkbox"
                        id="includeUppercase"
                        checked
                    >
                    Include uppercase letters
                </label>


                <label>
                    <input
                        type="checkbox"
                        id="includeNumbers"
                        checked
                    >
                    Include numbers
                </label>


                <label>
                    <input
                        type="checkbox"
                        id="includeSymbols"
                        checked
                    >
                    Include symbols
                </label>


                <button
                    type="button"
                    class="calculate-button"
                    id="generatePassword"
                >
                    Generate Password
                </button>

                <button type="button" class="clear-button">
    Clear
</button>


                <div
                    class="calculator-result"
                    id="passwordResult"
                >
                    Your password will appear here.
                </div>

            </div>

        </div>

    </main>


    <footer class="tool-footer">

    <div class="logo">
        <span>Tool</span>Nest
    </div>

    <p>
        Simple tools for everyday life.
    </p>

    <p>
        © 2026 ToolNest. All rights reserved.
    </p>

</footer>

    <!-- JAVASCRIPT -->

    <script>

        const passwordLength =
            document.getElementById("passwordLength");

        const includeUppercase =
            document.getElementById("includeUppercase");

        const includeNumbers =
            document.getElementById("includeNumbers");

        const includeSymbols =
            document.getElementById("includeSymbols");

        const generatePassword =
            document.getElementById("generatePassword");

        const passwordResult =
            document.getElementById("passwordResult");


        generatePassword.addEventListener(
            "click",
            function () {

                let length =
                    Number(passwordLength.value);


                if (
                    length < 8 ||
                    length > 64
                ) {

                    passwordResult.textContent =
                        "Password length must be between 8 and 64.";

                    return;

                }


                let characters =
                    "abcdefghijklmnopqrstuvwxyz";


                if (includeUppercase.checked) {

                    characters +=
                        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

                }


                if (includeNumbers.checked) {

                    characters +=
                        "0123456789";

                }


                if (includeSymbols.checked) {

                    characters +=
                        "!@#$%^&*()_+-=[]{}|;:,.<>?";

                }


                let password = "";


                const randomValues =
                    new Uint32Array(length);

                crypto.getRandomValues(
                    randomValues
                );


                for (
                    let i = 0;
                    i < length;
                    i++
                ) {

                    password +=
                        characters[
                            randomValues[i] %
                            characters.length
                        ];

                }


                passwordResult.innerHTML =
                    `
                    <strong>Your password:</strong>
                    <br><br>

                    <span
                        style="
                            word-break: break-all;
                            font-size: 18px;
                        "
                    >
                        ${password}
                    </span>
                    `;

            }
        );



    const clearButton =
        document.querySelector(".clear-button");

    clearButton.addEventListener("click", function () {

        passwordLength.value = "16";

        includeUppercase.checked = true;

        includeNumbers.checked = true;

        includeSymbols.checked = true;

        passwordResult.textContent =
            "Your password will appear here.";

    });


    </script>


<script>
const menuButton = document.getElementById("menuButton");
const navLinks = document.querySelector(".nav-links");

if (menuButton && navLinks) {

    menuButton.addEventListener("click", function () {

        navLinks.classList.toggle("menu-open");

    });

    const menuItems = navLinks.querySelectorAll("a");

    menuItems.forEach(function (link) {

        link.addEventListener("click", function () {

            navLinks.classList.remove("menu-open");

        });

    });

}
</script>

<script src="../script.js"></script>

</body>

</html>
