<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word Counter - ToolNest</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- NAVBAR -->
<header class="navbar">

    <div class="logo">
        <span>Tool</span>Nest
    </div>

    <nav class="nav-links">

        <a href="../index.html">Home</a>

        <a href="../index.html#tools">Tools</a>

        <a href="../index.html#categories">Categories</a>

        <a href="../index.html#about">About</a>

    </nav>

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Open menu"
    >
        ☰
    </button>

</header>

    <!-- WORD COUNTER -->
    <main class="calculator-page">

        <div class="calculator-container">

            <a href="../index.html" class="back-home">
    ← Back to ToolNest
</a>

            <h1>Word Counter</h1>

            <p class="calculator-description">
                Count words and characters in your text quickly and easily.
            </p>


            <div class="calculator-box">

                <label for="textInput">
                    Enter your text
                </label>

                <textarea
                    id="textInput"
                    rows="10"
                    placeholder="Type or paste your text here..."
                ></textarea>


                <div class="calculator-result">

                    <p>
                        <strong>Words:</strong>
                        <span id="wordCount">0</span>
                    </p>

                    <p>
                        <strong>Characters:</strong>
                        <span id="characterCount">0</span>
                    </p>

                    <p>
                        <strong>Characters without spaces:</strong>
                        <span id="characterNoSpaceCount">0</span>
                    </p>

                    <button type="button" class="clear-button">
    Clear
</button>

                </div>

            </div>

        </div>

    </main>

    <footer class="tool-footer">

    <div class="logo">
        <span>Tool</span>Nest
    </div>

    <p>
        Simple tools for everyday life.
    </p>

    <p>
        © 2026 ToolNest. All rights reserved.
    </p>

</footer>


    <!-- JAVASCRIPT -->
    <script>

        const textInput =
            document.getElementById("textInput");

        const wordCount =
            document.getElementById("wordCount");

        const characterCount =
            document.getElementById("characterCount");

        const characterNoSpaceCount =
            document.getElementById("characterNoSpaceCount");


        function countText() {

            const text = textInput.value;


            // Count characters
            characterCount.textContent =
                text.length;


            // Count characters without spaces
            characterNoSpaceCount.textContent =
                text.replace(/\s/g, "").length;


            // Count words
            const trimmedText =
                text.trim();

            if (trimmedText === "") {

                wordCount.textContent = "0";

            } else {

                const words =
                    trimmedText.split(/\s+/);

                wordCount.textContent =
                    words.length;

            }

        }


        textInput.addEventListener(
            "input",
            countText
        );

    </script>



<script>
const menuButton = document.getElementById("menuButton");
const navLinks = document.querySelector(".nav-links");

if (menuButton && navLinks) {

    menuButton.addEventListener("click", function () {

        navLinks.classList.toggle("menu-open");

    });

    const menuItems = navLinks.querySelectorAll("a");

    menuItems.forEach(function (link) {

        link.addEventListener("click", function () {

            navLinks.classList.remove("menu-open");

        });

    });

}



    const clearButton =
        document.querySelector(".clear-button");

    clearButton.addEventListener("click", function () {

        textInput.value = "";

        wordCount.textContent = "0";

        characterCount.textContent = "0";

        characterNoSpaceCount.textContent = "0";

    });

</script>

<script src="../script.js"></script>

</body>

</html>
